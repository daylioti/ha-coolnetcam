<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coolnet Cam</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
    gap: 4px;
    padding: 4px;
    height: 100vh;
  }
  .cam {
    position: relative;
    background: #000;
    overflow: hidden;
    cursor: pointer;
  }
  .cam video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .cam .label {
    position: absolute;
    top: 6px;
    left: 8px;
    background: rgba(0,0,0,0.6);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 13px;
    pointer-events: none;
  }
  .cam .status {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f44;
    pointer-events: none;
  }
  .cam .status.live { background: #4f4; }
  .cam.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 100;
  }
  .setup-link {
    position: fixed;
    bottom: 10px;
    right: 14px;
    z-index: 200;
    background: rgba(0,0,0,0.6);
    color: #eee;
    text-decoration: none;
    padding: 5px 11px;
    border-radius: 4px;
    font-size: 13px;
  }
  .setup-link:hover { background: rgba(0,0,0,0.85); }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<a href="/setup" class="setup-link">⚙ Add to Home Assistant</a>
<script>
const grid = document.getElementById('grid');

fetch('/api/cameras')
  .then(r => r.json())
  .then(cameras => {
    cameras.forEach(cam => createPlayer(cam));
  });

function createPlayer(cam) {
  const div = document.createElement('div');
  div.className = 'cam';
  div.innerHTML = `
    <video muted autoplay playsinline></video>
    <div class="label">${cam.name}</div>
    <div class="status" id="status-${cam.channelId}"></div>
  `;
  grid.appendChild(div);

  const video = div.querySelector('video');
  const status = div.querySelector('.status');

  // Click to toggle fullscreen
  div.addEventListener('click', () => {
    if (div.classList.contains('fullscreen')) {
      div.classList.remove('fullscreen');
    } else {
      document.querySelectorAll('.cam.fullscreen').forEach(c => c.classList.remove('fullscreen'));
      div.classList.add('fullscreen');
    }
  });

  if (Hls.isSupported()) {
    const hls = new Hls({
      liveSyncDurationCount: 1,
      liveMaxLatencyDurationCount: 3,
      liveBackBufferLength: 0,
      maxBufferLength: 2,
      maxMaxBufferLength: 4,
      maxBufferSize: 0.5 * 1024 * 1024,
      lowLatencyMode: true,
      backBufferLength: 0,
      enableWorker: true,
    });

    hls.loadSource(cam.streamUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
      status.classList.add('live');
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      status.classList.remove('live');
      if (data.fatal) {
        // Auto-recover
        setTimeout(() => {
          hls.loadSource(cam.streamUrl);
          hls.attachMedia(video);
        }, 3000);
      }
    });

    // Periodically skip to live edge to prevent drift
    setInterval(() => {
      if (video.readyState >= 2 && hls.liveSyncPosition) {
        const drift = hls.liveSyncPosition - video.currentTime;
        if (drift > 4) {
          video.currentTime = hls.liveSyncPosition;
        }
      }
    }, 5000);

  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari native HLS
    video.src = cam.streamUrl;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(() => {});
      status.classList.add('live');
    });
  }
}
</script>
</body>
</html>
